<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Huquq Testlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Debug console for testing on a real phone: open the mini app URL with
  // ?debug=1 appended and a floating console button appears so you can see
  // JS errors and network requests directly on your phone, no desktop needed.
  if (new URLSearchParams(window.location.search).get("debug") === "1") {
    var erudaScript = document.createElement("script");
    erudaScript.src = "https://cdn.jsdelivr.net/npm/eruda";
    erudaScript.onload = function () { window.eruda && window.eruda.init(); };
    document.head.appendChild(erudaScript);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D12;
    --surface: #14171F;
    --surface-2: #1B1F2A;
    --border: #262B37;
    --text: #EDEEF2;
    --text-dim: #868C9B;
    --text-faint: #565C6B;

    --accent: #6E8BFA;
    --accent-dim: #4E63B0;
    --accent-soft: rgba(110, 139, 250, 0.12);
    --accent-soft-strong: rgba(110, 139, 250, 0.18);

    --good: #4FBE84;
    --good-soft: rgba(79, 190, 132, 0.12);
    --bad: #E5686B;
    --bad-soft: rgba(229, 104, 107, 0.12);

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overscroll-behavior-y: none; }

  body {
    margin: 0;
    min-height: 100dvh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 480px; margin: 0 auto; }

  /* ---------- Masthead ---------- */
  .masthead { margin-bottom: 26px; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--accent);
  }
  .brand {
    margin: 0;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  h1.page-title {
    font-weight: 700;
    font-size: 21px;
    letter-spacing: -0.2px;
    margin: 0 0 4px;
    color: var(--text);
  }
  .page-sub {
    font-size: 13.5px;
    color: var(--text-dim);
    margin: 0 0 20px;
  }

  /* ---------- Row list (subjects / modules) ---------- */
  .row-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 14px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }
  .row:active { transform: scale(0.985); background: var(--surface-2); }
  .tag {
    flex: none;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 6px 9px;
    min-width: 30px;
    text-align: center;
  }
  .row-body { flex: 1; min-width: 0; }
  .row-title {
    display: block;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }
  .row-hint {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .chev { flex: none; color: var(--text-faint); font-size: 18px; }

  .ai-tutor-row { margin: 0 0 20px; }
  .ai-tutor-row .row {
    background: var(--accent-soft);
    border: 1px solid rgba(110,139,250,0.28);
  }
  .ai-tutor-row .tag { background: rgba(110,139,250,0.22); }
  .ai-tutor-row .row-title { color: var(--text); }

  /* ---------- Buttons ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #0B0D12;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn.ghost {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.subtle {
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(110,139,250,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 13px;
    font-size: 14px;
  }
  .btn.subtle:active { background: var(--accent-soft); }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    font-size: 13.5px;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .back:active { opacity: 0.6; }

  /* ---------- Quiz ---------- */
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .quiz-count { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
  .progress-track {
    height: 4px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .quiz-question {
    font-weight: 700;
    font-size: 19px;
    line-height: 1.42;
    letter-spacing: -0.2px;
    color: var(--text);
    margin: 0 0 20px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 9px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .option:active { background: var(--surface-2); }
  .option-badge {
    flex: none;
    width: 25px; height: 25px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 11.5px;
    color: var(--text-dim);
    transition: background 0.15s, color 0.15s;
  }
  .option.correct {
    border-color: var(--border);
    border-left-color: var(--good);
    background: var(--good-soft);
  }
  .option.correct .option-badge { background: var(--good); color: #0B0D12; }
  .option.wrong {
    border-color: var(--border);
    border-left-color: var(--bad);
    background: var(--bad-soft);
  }
  .option.wrong .option-badge { background: var(--bad); color: #0B0D12; }
  .option.faded { opacity: 0.45; }

  .result-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    margin: 6px 0 16px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .result-banner.is-correct { background: var(--good-soft); color: var(--good); }
  .result-banner.is-wrong { background: var(--bad-soft); color: var(--bad); }
  .result-banner .r-icon {
    flex: none;
    width: 21px; height: 21px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .result-banner.is-correct .r-icon { background: var(--good); color: #0B0D12; }
  .result-banner.is-wrong .r-icon { background: var(--bad); color: #0B0D12; }

  /* ---------- AI thread ---------- */
  .ai-thread { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .ai-turn { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: bubbleIn 0.2s ease; }
  .ai-turn.q { align-self: flex-end; flex-direction: row-reverse; }
  .ai-turn.a { align-self: flex-start; }
  .ai-avatar {
    flex: none;
    width: 23px; height: 23px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px;
    font-weight: 700;
  }
  .ai-turn.q .ai-avatar { background: var(--accent); color: #0B0D12; }
  .ai-turn.a .ai-avatar { background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); }
  .ai-bubble {
    padding: 11px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    border-radius: 15px;
  }
  .ai-turn.q .ai-bubble { background: var(--accent); color: #0B0D12; border-radius: 15px 15px 4px 15px; font-weight: 500; }
  .ai-turn.a .ai-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 15px 15px 15px 4px; }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .ai-typing { align-self: flex-start; display: flex; align-items: flex-end; gap: 8px; }
  .ai-typing-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px 15px 15px 4px;
    padding: 11px 15px;
    display: flex; align-items: center; gap: 7px;
  }
  .ai-typing-bubble .ai-typing-label { font-size: 12px; color: var(--text-dim); }
  .ai-typing-bubble .dots { display: flex; gap: 3px; }
  .ai-typing-bubble .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: dotBounce 1.1s infinite ease-in-out; }
  .ai-typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .ai-typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-4px); opacity: 1; } }

  .ai-followup { display: flex; gap: 8px; margin-top: 12px; }
  .ai-followup input {
    flex: 1;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
  }
  .ai-followup input:focus { outline: none; border-color: var(--accent); }
  .ai-followup input::placeholder { color: var(--text-faint); }
  .ai-followup button {
    flex: none;
    padding: 0 18px;
    background: var(--accent);
    border: none;
    color: #0B0D12;
    border-radius: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .ai-followup button:active { opacity: 0.75; }
  .ai-followup button:disabled { opacity: 0.4; }

  .ai-tutor-composer {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: calc(100% - 32px);
    max-width: 448px;
    z-index: 8;
  }
  .ai-tutor-composer .ai-followup { margin-top: 0; }
  .ai-tutor-thread { padding-bottom: 82px; min-height: calc(100dvh - 260px); }

  /* ---------- Skeleton / empty states ---------- */
  .skeleton-row {
    display: flex; align-items: center; gap: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 14px;
    margin-bottom: 8px;
  }
  .skeleton-bar {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  .notice { text-align: center; padding: 54px 20px; color: var(--text-dim); }
  .notice-dot {
    width: 44px; height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-weight: 700;
    font-size: 16px;
  }
  .notice p { font-size: 14px; line-height: 1.6; margin: 0; }
  .notice .lead { font-weight: 700; font-size: 16.5px; color: var(--text); margin-bottom: 6px; }

  .paywall-card {
    text-align: center;
    padding: 36px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .paywall-card .notice-dot { background: var(--accent-soft); color: var(--accent); width: 48px; height: 48px; font-size: 18px; }
  .paywall-card h1 { font-weight: 700; font-size: 18px; margin: 0 0 8px; color: var(--text); }
  .paywall-card p { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; margin: 0 0 4px; }
  .paywall-note { font-size: 11.5px; color: var(--text-faint); margin-top: 16px; font-weight: 600; letter-spacing: 0.3px; }

  .done-wrap { text-align: center; padding: 34px 10px; }
  .done-seal {
    width: 68px; height: 68px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: var(--accent);
  }
  .done-score { font-size: 30px; font-weight: 800; color: var(--text); margin: 0 0 6px; letter-spacing: -0.5px; }
  .done-line { font-size: 14px; color: var(--text-dim); margin: 0 0 22px; }

  .view-enter { animation: viewIn 0.2s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .view-enter { animation: none; }
    .skeleton-bar { animation: none; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ---- CONFIG ----
const API_BASE = "https://telegram-mini-ai.onrender.com";
// -----------------

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor && tg.setHeaderColor("#0B0D12"); } catch (e) {}
  try { tg.setBackgroundColor && tg.setBackgroundColor("#0B0D12"); } catch (e) {}
}

let sessionToken = null;
let cachedSubjects = [];
let state = { view: "loading" };

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (sessionToken) headers["Authorization"] = `Bearer ${sessionToken}`;
  if (options.body) headers["Content-Type"] = "application/json";
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 402) { state = { view: "paywall" }; render(); throw new Error("paywall"); }
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

async function login() {
  const initData = tg?.initData || "";
  if (!initData) {
    state = { view: "no_telegram" };
    render();
    return;
  }
  const data = await api("/auth/telegram", {
    method: "POST",
    body: JSON.stringify({ init_data: initData }),
  });
  sessionToken = data.token;
  loadSubjects();
}

async function loadSubjects() {
  state = { view: "loading" };
  render();
  const subjects = await api("/content/subjects");
  cachedSubjects = subjects;
  state = { view: "subjects", subjects };
  render();
}

function openAiTutor() {
  state = { view: "ai_tutor", subjects: cachedSubjects, aiTutorThread: [], aiTutorLoading: false };
  render();
}

async function askAiTutor() {
  const input = document.getElementById("aiTutorInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text || state.aiTutorLoading) return;
  input.value = "";
  state.aiTutorThread.push({ role: "q", text });
  state.aiTutorLoading = true;
  render();
  try {
    const data = await api("/ai/ask", {
      method: "POST",
      body: JSON.stringify({
        question: text,
        context: "Foydalanuvchi Milliy sertifikat imtihoniga (huquq fanlari: Konstitutsiyaviy huquq, Fuqarolik huquqi va h.k.) tayyorlanmoqda. Savolga repetitor sifatida qisqa va aniq javob bering.",
      }),
    });
    state.aiTutorThread.push({ role: "a", text: data.answer });
  } catch (e) {
    if (e.message !== "paywall") {
      state.aiTutorThread.push({ role: "a", text: "Xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring." });
    }
  }
  state.aiTutorLoading = false;
  render();
  const freshInput = document.getElementById("aiTutorInput");
  if (freshInput) freshInput.focus();
}

async function openSubject(subject) {
  state = { view: "loading" };
  render();
  const modules = await api(`/content/subjects/${subject.id}/modules`);
  state = { view: "modules", subject, modules };
  render();
}

async function openModule(subject, module) {
  state = { view: "loading" };
  render();
  const questions = await api(`/quiz/modules/${module.id}/questions`);
  state = {
    view: "quiz", subject, module, questions, index: 0, correctCount: 0,
    answered: null, explainRequested: false, aiLoading: false, aiThread: [], followupLoading: false,
  };
  render();
}

function buildQuestionContext(q, a) {
  const opts = { a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d };
  const correctText = opts[a.correct_option];
  const selectedText = opts[a.selected];
  let context = `Savol: ${q.text}\nVariantlar: A) ${q.option_a} B) ${q.option_b} C) ${q.option_c} D) ${q.option_d}\nTo'g'ri javob: ${correctText}`;
  if (!a.correct) {
    context += `\nO'quvchi tanlagan (noto'g'ri) javob: ${selectedText}`;
  }
  return context;
}

// Only fires when the user taps "Tushuntirishni ko'rish" - not automatic,
// so a session of e.g. 50 questions doesn't burn 50 AI calls by itself.
async function explainAnswer() {
  state.explainRequested = true;
  state.aiLoading = true;
  render();
  try {
    const q = state.questions[state.index];
    const a = state.answered;
    const context = buildQuestionContext(q, a);
    const question = a.correct
      ? "Nega bu javob to'g'ri? Qisqa va aniq tushuntiring."
      : "O'quvchi noto'g'ri javobni tanladi. Repetitor sifatida tushuntiring: 1) nega o'quvchi tanlagan javob noto'g'ri, 2) nega to'g'ri javob to'g'ri. Qisqa va aniq bo'lsin.";

    const data = await api("/ai/ask", {
      method: "POST",
      body: JSON.stringify({ question, context }),
    });
    state.aiThread.push({ role: "a", text: data.answer });
  } catch (e) {
    if (e.message !== "paywall") {
      state.aiThread.push({ role: "a", text: "Xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring." });
    }
  }
  state.aiLoading = false;
  render();
}

// Free-text AI tutor follow-up: user can ask their own question about the
// current quiz question, on top of the on-demand explanation above.
async function askFollowup() {
  const input = document.getElementById("aiFollowupInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text || state.followupLoading) return;
  input.value = "";
  state.aiThread.push({ role: "q", text });
  state.followupLoading = true;
  render();
  try {
    const q = state.questions[state.index];
    const a = state.answered;
    const lastAnswer = [...state.aiThread].reverse().find(t => t.role === "a" && t.text !== undefined);
    const context = buildQuestionContext(q, a) +
      (lastAnswer ? `\nAI tushuntirishi: ${lastAnswer.text}` : "");
    const data = await api("/ai/ask", {
      method: "POST",
      body: JSON.stringify({ question: text, context }),
    });
    state.aiThread.push({ role: "a", text: data.answer });
  } catch (e) {
    if (e.message !== "paywall") {
      state.aiThread.push({ role: "a", text: "Xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring." });
    }
  }
  state.followupLoading = false;
  render();
  const freshInput = document.getElementById("aiFollowupInput");
  if (freshInput) freshInput.focus();
}

async function answer(selected) {
  if (state.answered) return;
  try {
    const q = state.questions[state.index];
    const result = await api("/quiz/answer", {
      method: "POST",
      body: JSON.stringify({ question_id: q.id, selected_option: selected }),
    });
    state.answered = { selected, ...result };
    if (result.correct) state.correctCount++;
    state.explainRequested = false;
    state.aiThread = [];
    state.aiLoading = false;
    render();
  } catch (e) {
    if (e.message !== "paywall") console.error(e);
  }
}

function nextQuestion() {
  if (state.index + 1 >= state.questions.length) {
    state.view = "done";
  } else {
    state.index++;
    state.answered = null;
    state.explainRequested = false;
    state.aiLoading = false;
    state.aiThread = [];
  }
  render();
}

function doneLine(score, total) {
  const pct = total ? score / total : 0;
  if (pct === 1) return "Barcha savollarga to'g'ri javob berdingiz.";
  if (pct >= 0.8) return "Ajoyib natija — shu tarzda davom eting.";
  if (pct >= 0.5) return "Yaxshi urinish. Xato javoblarni qayta ko'rib chiqing.";
  return "Bu modulni yana bir bor takrorlash foydali bo'ladi.";
}

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function render() {
  const app = document.getElementById("app");
  app.classList.remove("view-enter");

  if (state.view === "loading") {
    app.innerHTML = `
      <div class="masthead">
        <p class="eyebrow">Milliy sertifikat</p>
        <h1 class="brand">Huquq Testlar</h1>
      </div>
      ${[1,2,3,4].map(() => `
        <div class="skeleton-row">
          <div class="skeleton-bar" style="width:34px;height:26px;"></div>
          <div style="flex:1"><div class="skeleton-bar" style="width:70%;height:14px;margin-bottom:6px;"></div><div class="skeleton-bar" style="width:40%;height:11px;"></div></div>
        </div>
      `).join("")}
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }

  if (state.view === "no_telegram") {
    app.innerHTML = `
      <div class="notice">
        <div class="notice-dot">HT</div>
        <p class="lead">Telegram orqali oching</p>
        <p>Ushbu ilova botning menyu tugmasi orqali Telegram ichida ochilganda ishlaydi — shundagina hisobingizga kirish mumkin bo'ladi.</p>
      </div>
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }

  if (state.view === "paywall") {
    app.innerHTML = `
      <div class="paywall-card">
        <div class="notice-dot">HT</div>
        <h1>Bugungi bepul savollar tugadi</h1>
        <p>Kuniga 3 ta bepul savol taqdim etiladi. Hisoblagich yarim tunda yangilanadi.</p>
        <button class="btn ghost" data-action="reload">Orqaga qaytish</button>
        <p class="paywall-note">CHEKSIZ KIRISH — TEZ ORADA</p>
      </div>
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }

  if (state.view === "subjects") {
    app.innerHTML = `
      <div class="masthead">
        <p class="eyebrow">Milliy sertifikat</p>
        <h1 class="brand">Huquq Testlar</h1>
      </div>
      <div class="ai-tutor-row">
        <button class="row" data-action="open-ai-tutor">
          <span class="tag">AI</span>
          <span class="row-body">
            <span class="row-title">AI Yordamchi bilan suhbat</span>
            <span class="row-hint">Har qanday huquqiy savolingizni bering</span>
          </span>
          <span class="chev">›</span>
        </button>
      </div>
      <h1 class="page-title">Mavzular</h1>
      <p class="page-sub">Boshlash uchun mavzuni tanlang</p>
      ${state.subjects.length ? `
        <div class="row-list">
          ${state.subjects.map((s, i) => `
            <button class="row" data-action="open-subject" data-subject-id="${esc(s.id)}">
              <span class="tag">№${i + 1}</span>
              <span class="row-body">
                <span class="row-title">${esc(s.title)}</span>
                <span class="row-hint">Mavzu bo'yicha testlar</span>
              </span>
              <span class="chev">›</span>
            </button>
          `).join("")}
        </div>
      ` : `
        <div class="notice">
          <div class="notice-dot">HT</div>
          <p class="lead">Hozircha mavzular yo'q</p>
          <p>Mavzular tez orada qo'shiladi. Iltimos, birozdan so'ng qayta tekshiring.</p>
        </div>
      `}
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }

  if (state.view === "modules") {
    app.innerHTML = `
      <span class="back" data-action="back-to-subjects">&larr; Mavzularga qaytish</span>
      <h1 class="page-title">${esc(state.subject.title)}</h1>
      <p class="page-sub">Modulni tanlang</p>
      ${state.modules.length ? `
        <div class="row-list">
          ${state.modules.map(m => `
            <button class="row" data-action="open-module" data-module-id="${esc(m.id)}">
              <span class="tag">${esc(m.label)}</span>
              <span class="row-body">
                <span class="row-title">Moddalar ${esc(m.label)}</span>
                <span class="row-hint">Testni boshlash</span>
              </span>
              <span class="chev">›</span>
            </button>
          `).join("")}
        </div>
      ` : `
        <div class="notice">
          <div class="notice-dot">HT</div>
          <p class="lead">Hozircha modullar yo'q</p>
          <p>Ushbu mavzu bo'yicha modullar tez orada qo'shiladi.</p>
        </div>
      `}
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }

  if (state.view === "quiz") {
    const q = state.questions[state.index];
    if (!q) {
      app.innerHTML = `
        <span class="back" data-action="back-to-modules">&larr; Orqaga</span>
        <div class="notice"><p class="lead">Bu modulda savollar yo'q</p></div>
      `;
      void app.offsetWidth; app.classList.add("view-enter");
      return;
    }
    const a = state.answered;
    const optClass = (k) => {
      if (!a) return "";
      if (k === a.correct_option) return "correct";
      if (k === a.selected) return "wrong";
      return "faded";
    };
    const pct = Math.round(((state.index + (a ? 1 : 0)) / state.questions.length) * 100);
    app.innerHTML = `
      <span class="back" data-action="back-to-modules">&larr; Orqaga</span>
      <div class="quiz-meta">
        <span class="quiz-count">SAVOL ${state.index + 1} / ${state.questions.length}</span>
        <span class="quiz-count">${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="quiz-question">${esc(q.text)}</p>
      <button class="option ${optClass('a')}" data-action="answer" data-option="a"><span class="option-badge">A</span>${esc(q.option_a)}</button>
      <button class="option ${optClass('b')}" data-action="answer" data-option="b"><span class="option-badge">B</span>${esc(q.option_b)}</button>
      <button class="option ${optClass('c')}" data-action="answer" data-option="c"><span class="option-badge">C</span>${esc(q.option_c)}</button>
      <button class="option ${optClass('d')}" data-action="answer" data-option="d"><span class="option-badge">D</span>${esc(q.option_d)}</button>
      ${a ? `
        <div class="result-banner ${a.correct ? 'is-correct' : 'is-wrong'}">
          <span class="r-icon">${a.correct ? '✓' : '✕'}</span>
          <span>${a.correct ? "To'g'ri javob!" : "Noto'g'ri javob."}</span>
        </div>
        ${!state.explainRequested ? `
          <button class="btn subtle" data-action="explain">
            <span>✨</span><span>Tushuntirishni ko'rish</span>
          </button>
        ` : `
          <div class="ai-thread">
            ${state.aiThread.map(t => `
              <div class="ai-turn ${t.role}">
                <span class="ai-avatar">${t.role === 'q' ? 'S' : 'AI'}</span>
                <div class="ai-bubble">${esc(t.text)}</div>
              </div>
            `).join("")}
            ${state.aiLoading ? `
              <div class="ai-turn a ai-typing">
                <span class="ai-avatar">AI</span>
                <div class="ai-typing-bubble">
                  <span class="ai-typing-label">O'ylayapman</span>
                  <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
                </div>
              </div>
            ` : ""}
          </div>
          ${(!state.aiLoading && state.aiThread.length) ? `
            <div class="ai-followup">
              <input type="text" id="aiFollowupInput" placeholder="Qo'shimcha savol bering..." ${state.followupLoading ? "disabled" : ""} />
              <button data-action="ai-followup" ${state.followupLoading ? "disabled" : ""}>${state.followupLoading ? "..." : "Yuborish"}</button>
            </div>
          ` : ""}
        `}
        <button class="btn" data-action="next">Keyingisi</button>
      ` : ""}
    `;
    void app.offsetWidth; app.classList.add("view-enter");

    const followupInput = document.getElementById("aiFollowupInput");
    if (followupInput) {
      followupInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") askFollowup();
      });
    }
    return;
  }

  if (state.view === "ai_tutor") {
    app.innerHTML = `
      <span class="back" data-action="back-to-subjects">&larr; Mavzularga qaytish</span>
      <h1 class="page-title">AI Yordamchi</h1>
      <p class="page-sub">Har qanday huquqiy savolingizni bering</p>
      <div class="ai-thread ai-tutor-thread">
        ${state.aiTutorThread.length === 0 && !state.aiTutorLoading ? `
          <div class="ai-turn a">
            <span class="ai-avatar">AI</span>
            <div class="ai-bubble">Salom! Konstitutsiyaviy huquq, Fuqarolik huquqi va boshqa fanlar bo'yicha savolingizni yozing — birga ko'rib chiqamiz.</div>
          </div>
        ` : ""}
        ${state.aiTutorThread.map(t => `
          <div class="ai-turn ${t.role}">
            <span class="ai-avatar">${t.role === 'q' ? 'S' : 'AI'}</span>
            <div class="ai-bubble">${esc(t.text)}</div>
          </div>
        `).join("")}
        ${state.aiTutorLoading ? `
          <div class="ai-turn a ai-typing">
            <span class="ai-avatar">AI</span>
            <div class="ai-typing-bubble">
              <span class="ai-typing-label">O'ylayapman</span>
              <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
            </div>
          </div>
        ` : ""}
      </div>
      <div class="ai-tutor-composer">
        <div class="ai-followup">
          <input type="text" id="aiTutorInput" placeholder="Savolingizni yozing..." ${state.aiTutorLoading ? "disabled" : ""} />
          <button data-action="ai-tutor-send" ${state.aiTutorLoading ? "disabled" : ""}>${state.aiTutorLoading ? "..." : "Yuborish"}</button>
        </div>
      </div>
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    const tutorInput = document.getElementById("aiTutorInput");
    if (tutorInput) {
      tutorInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") askAiTutor();
      });
      tutorInput.focus();
    }
    return;
  }

  if (state.view === "done") {
    app.innerHTML = `
      <div class="done-wrap">
        <div class="done-seal">✓</div>
        <p class="done-score">${state.correctCount} / ${state.questions.length}</p>
        <p class="done-line">${doneLine(state.correctCount, state.questions.length)}</p>
        <button class="btn" data-action="back-to-modules">Modullarga qaytish</button>
      </div>
    `;
    void app.offsetWidth; app.classList.add("view-enter");
    return;
  }
}

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "open-subject") {
    const subject = state.subjects.find(s => String(s.id) === el.dataset.subjectId);
    if (subject) openSubject(subject);
  } else if (action === "open-module") {
    const module = state.modules.find(m => String(m.id) === el.dataset.moduleId);
    if (module) openModule(state.subject, module);
  } else if (action === "back-to-subjects") {
    if (cachedSubjects.length) {
      state = { view: "subjects", subjects: cachedSubjects };
      render();
    } else {
      loadSubjects();
    }
  } else if (action === "back-to-modules") {
    openSubject(state.subject);
  } else if (action === "answer") {
    answer(el.dataset.option);
  } else if (action === "open-ai-tutor") {
    openAiTutor();
  } else if (action === "ai-tutor-send") {
    askAiTutor();
  } else if (action === "ai-followup") {
    askFollowup();
  } else if (action === "explain") {
    explainAnswer();
  } else if (action === "next") {
    nextQuestion();
  } else if (action === "reload") {
    window.location.reload();
  }
});

login();
</script>
</body>
</html>
